# Cursor Model Orchestrator — routing policy (v1 — Cursor models only)
# Logical model keys resolve via config/models.generated.yaml
#
# Doctrine: recommend only from the weekly Cursor models pool
# (Composer 2.5 standard, Grok 4.7 standard, Auto Cost).
# Third-party models are never in the matrix; one paid turn needs HITL.

version: 2

defaults:
  mode: balance
  language_user_facing: ru
  workflow: plan_then_approve
  daily_driver: auto_cost_or_composer
  explain_every_route: true
  doctrine: planner_executor
  # Fast burns the weekly pool faster; recommend standard unless user asks Fast/500k.
  prefer_standard_speed: true

# Planner / executor split inside the Cursor pool
doctrine:
  name: planner_executor
  # Grok: plans, specs, science/paper Q&A. Composer: file edits and routine agent work.
  never_third_party_in_matrix: true
  never_recommend_fast_unless_asked: true
  never_recommend_500k_unless_asked: true
  executor_default: cursor.composer
  executor_quality: cursor.composer   # UI and code both on Composer standard
  planner_default: cursor.grok_flagship
  planner_hard: cursor.grok_flagship
  planner_max: cursor.grok_flagship
  routine_default: cursor.auto_cost   # Plus has no Auto → fall back to composer
  handoff_ru: >
    После approve переключи чат на Composer 2.5 standard (не Fast)
    и выполни план пошагово. План должен быть достаточно подробным
    для Composer (файлы, шаги, критерии done).
  model_ids:
    composer_standard: composer-2.5[fast=false]
    grok_standard: grok-4.7[fast=false]
    auto_cost: Auto

hitl:
  # Any explicit third-party pin (Claude/GPT/Gemini/Muse/Fable) or paid override phrase.
  require_confirm_for:
    - third_party_pin
    - paid_override_phrase
  one_turn_only: true
  confirm_prompt_ru: >
    Эта модель списывается из prepaid credit, не из недельного пула Cursor.
    Разрешить один ход на названной модели? (да/нет)
  confirm_prompt_fable_extra_ru: >
    У Fable Anthropic хранит вход и выход для harm-prevention
    (не для обучения моделей).
  after_yes: allow_one_paid_turn
  after_no: fall_back_to_matrix

budget:
  source_local: config/budget.local.yaml
  source: config/budget.yaml
  sync_script: scripts/sync_budget.py
  sync_ttl_minutes: 60
  on_exhausted: force_eco
  on_warn_ratio: warn_and_prefer_composer
  override_phrases_ru:
    - разреши дорогие модели
    - /max force
  sync_phrases_ru:
    - синхронизируй бюджет
    - /budget sync
  # Prefer live weekly Cursor-pool % when sync confirms a field; else unknown.
  spend_field: unknown

# Shared Cursor-only matrix for: /eco, pool exhausted, hard-block@warn_ratio (no override).
exhausted_policy:
  pool: cursor
  same_as: eco
  triggers:
    - slash_eco
    - pool_exhausted
    - hard_block_at_warn_ratio
  display_rule: >
    [route] must show mode=eco or budget=exhausted|warn and a Cursor display name —
    never a third-party model name from the matrix.
  warnings_ru:
    science_stats: >
      Недельный пул Cursor на исходе или eco — ответ на Composer 2.5 standard.
      Перепроверь цифры, формулы и статистические выводы.
    paper: >
      Пул Cursor / eco — текст на Composer 2.5 standard (риск качества vs Grok).
    frontend_design: >
      Пул Cursor / eco — UI на Composer 2.5 standard.
    refactor_architecture: >
      Пул Cursor / eco — рефакторинг на Composer 2.5 standard.
    long_agent: >
      Пул Cursor / eco — длинная сессия на Composer; plan → approve.
  matrix:
    quick_edit: cursor.composer
    default_code: cursor.composer
    research_docs: cursor.composer
    cursor_meta: cursor.composer
    docs_office: cursor.composer  # if academic → use paper row
    frontend_design: cursor.composer
    paper: cursor.composer
    science_stats: cursor.composer
    refactor_architecture: cursor.composer
    long_agent: cursor.composer
    parallel_roles: role_map_exhausted

modes:
  eco:
    allow_third_party: false
    allow_best_of_n: false
    allow_cascade: false
    force_composer_standard: true
    fallback_logical: cursor.composer
  balance:
    allow_third_party: false
    allow_best_of_n: false
    allow_cascade: false
    # Matrix: routine → Auto Cost / Composer; hard plan/analyze → Grok; code → Composer
  max:
    allow_third_party: false
    allow_best_of_n: false   # still recommend-only; no spawn
    allow_cascade: false
    prefer_grok_on_hard: true
    # Grok standard for plan and heavy execute; still no Fast / no third-party

# Severity order (highest first) when multiple tiers match
tier_severity:
  - science_stats
  - refactor_architecture
  - long_agent
  - parallel_roles
  - paper
  - frontend_design
  - docs_office
  - research_docs
  - cursor_meta
  - default_code
  - quick_edit

tiers:
  quick_edit:
    hard: false
    pool: cursor
    logical_model:
      balance: cursor.auto_cost
      eco: cursor.composer
      max: cursor.auto_cost
    fallback_if_blocked: cursor.composer
    notes: Tiny 1-file edits; Composer standard if Auto unavailable (Plus).

  default_code:
    hard: false
    pool: cursor
    logical_model:
      balance: cursor.auto_cost
      eco: cursor.composer
      max: cursor.composer
    executor_logical:
      balance: cursor.composer
      eco: cursor.composer
      max: cursor.composer
    fallback_if_blocked: cursor.composer
    escalate_to: refactor_architecture

  refactor_architecture:
    hard: true
    pool: cursor
    phase_aware: true
    logical_model:
      balance: cursor.grok_flagship
      eco: cursor.composer
      max: cursor.grok_flagship
    executor_logical:
      balance: cursor.composer
      eco: cursor.composer
      max: cursor.grok_flagship
    fallback_if_blocked: cursor.composer
    notes: "Grok plans multi-file work; Composer applies edits (max - Grok may execute)."

  science_stats:
    hard: true
    pool: cursor
    phase_aware: true
    cheap_first: false
    logical_model:
      balance: cursor.grok_flagship
      eco: cursor.composer
      max: cursor.grok_flagship
    executor_logical:
      balance: cursor.composer
      eco: cursor.composer
      max: cursor.composer
    fallback_if_blocked: cursor.composer
    notes: Q&A/interpret on Grok; code/notebooks on Composer. Eco → Composer + science warning.

  paper:
    hard: true
    pool: cursor
    phase_aware: false
    logical_model:
      balance: cursor.grok_flagship
      eco: cursor.composer
      max: cursor.grok_flagship
    fallback_if_blocked: cursor.composer
    notes: Prose on Grok. Paper tooling code → Composer execute.

  frontend_design:
    hard: false
    pool: cursor
    phase_aware: true
    logical_model:
      balance: cursor.grok_flagship
      eco: cursor.composer
      max: cursor.grok_flagship
    executor_logical:
      balance: cursor.composer
      eco: cursor.composer
      max: cursor.composer
    fallback_if_blocked: cursor.composer
    notes: Grok plans UI; Composer implements — never Fast unless asked.

  docs_office:
    hard: false
    pool: cursor
    logical_model:
      balance: cursor.auto_cost
      eco: cursor.composer
      max: cursor.auto_cost
    fallback_if_blocked: cursor.composer
    notes: Bias paper tier if academic content (then eco→Composer).

  research_docs:
    hard: false
    pool: cursor
    logical_model:
      balance: cursor.auto_cost
      eco: cursor.composer
      max: cursor.grok_flagship
    fallback_if_blocked: cursor.composer
    notes: Deep synthesis may use Grok in max; still Cursor pool only.

  cursor_meta:
    hard: false
    pool: cursor
    logical_model:
      balance: cursor.composer
      eco: cursor.composer
      max: cursor.composer
    fallback_if_blocked: cursor.composer
    escalate_to: refactor_architecture

  long_agent:
    hard: true
    pool: cursor
    phase_aware: true
    logical_model:
      balance: cursor.grok_flagship
      eco: cursor.composer
      max: cursor.grok_flagship
    executor_logical:
      balance: cursor.composer
      eco: cursor.composer
      max: cursor.grok_flagship
    fallback_if_blocked: cursor.composer
    remind_plan_approve: true
    notes: Grok owns the long plan; Composer runs steps (max may keep Grok).

  parallel_roles:
    hard: true
    pool: cursor
    v0_behavior: advise_only
    role_map:
      planner: cursor.grok_flagship
      coder: cursor.composer
      reviewer: cursor.grok_flagship
      researcher: cursor.grok_flagship
      verifier: cursor.composer
      scientist: cursor.grok_flagship
    role_map_exhausted:
      planner: cursor.composer
      coder: cursor.composer
      reviewer: cursor.composer
      researcher: cursor.composer
      verifier: cursor.composer
      scientist: cursor.composer
    notes: Advise role map only — never spawn. All roles stay in Cursor pool.

project_type_nudges:
  ds:
    bias_tiers: [science_stats, default_code]
  paper:
    bias_tiers: [paper, science_stats]
  web:
    bias_tiers: [frontend_design, default_code]
  backend:
    bias_tiers: [default_code, refactor_architecture]
  cursor_meta:
    bias_tiers: [cursor_meta]
  mixed:
    bias_tiers: []

# Phase detection — which model to put in [route] model=
# role=plan → logical_model; role=код → executor_logical; role=анализ → logical_model (Q&A)
phases:
  roles:
    plan: план
    execute: код
    analyze: анализ
  force_execute_if:
    - реализуй
    - выполни план
    - напиши код
    - apply the plan
    - implement
    - сделай правк
    - поправь файл
    - закоммить
  force_plan_if:
    - спланируй
    - составь план
    - разжуй
    - подробно опиши
    - design the approach
    - предложи архитектуру
  default_plan_tiers:
    - refactor_architecture
    - long_agent
    - parallel_roles
    - frontend_design
  analyze_tiers:
    - science_stats
    - paper
    - research_docs
  always_execute_tiers:
    - quick_edit
    - default_code
    - cursor_meta
    - docs_office

# Plan shapes — recommend-only hints. Do not spawn agents from this section.
plan_shapes:
  default: none
  by_tier:
    parallel_roles: specialist
    refactor_architecture: pipeline
    long_agent: hybrid
    science_stats: none
    quick_edit: none
    default_code: none
    research_docs: none
    cursor_meta: none
    docs_office: none
    frontend_design: none
    paper: none
  splitter_hint: true
  splitter_roles:
    specialist: [planner, coder, reviewer, researcher, verifier, scientist]
    pipeline: [planner, coder, reviewer, verifier]
    hybrid: [planner, coder, reviewer]
    mapper: [planner]
    none: []

# Documented role map (advise-only). Same Cursor-only models.
roles_v1:
  planner: cursor.grok_flagship
  reviewer: cursor.grok_flagship
  coder: cursor.composer
  researcher: cursor.grok_flagship
  verifier: cursor.composer
  scientist: cursor.grok_flagship
