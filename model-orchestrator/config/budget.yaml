# Weekly Cursor-models pool budget policy (thresholds — committed)
# Spend snapshot: run `python scripts/sync_budget.py` → config/budget.local.yaml (gitignored)
# Skill prefers budget.local.yaml when fresh (see sync_ttl_minutes); else falls back here.

version: 2

# Official docs: one weekly pool for Grok 4.7/4.6/4.5 + Composer 2.5 (shared with Grok apps).
# There is no stable dollar size for that pool in public docs — do not invent remaining_usd.

warn_at_ratio: 0.8
block_hard_other_at_ratio: 0.8

# How often the skill should re-run sync_budget.py before classify (minutes)
sync_ttl_minutes: 60

# Prefer auto_percent_used from sync as a heuristic for weekly pool %.
# Official docs do not name that JSON field. If sync sets budget_source=unknown,
# skill must show budget=unknown and must not block hard tiers on legacy api%.
spend_field: unknown

# Set true only after HITL yes for a one-turn third-party pin this session
hard_other_override: false

updated_at: "2026-11-07"
notes: >
  Preferred: python scripts/sync_budget.py (reads local Cursor session).
  Chat: «синхронизируй бюджет» or /budget sync → force sync.
  At spent_ratio >= warn_at_ratio (when budget_source is heuristic_auto_percent)
  → warn + prefer Composer standard unless user completed paid HITL.
  At spent_ratio >= 1 → force eco (Composer standard only).
  If budget_source=unknown → do not treat api_percent_used as the weekly pool.

# Manual commands (tell the agent in chat, Russian OK):
#   «синхронизируй бюджет» / `/budget sync` → run sync_budget.py
#   «разреши дорогие модели» / `/max force` → HITL for one third-party turn
