[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-optimizer"
version = "0.2.3"
description = "Audit, optimize, and safely maintain Agent Skills ecosystems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "dapetun" }]
keywords = ["agent-skills", "skills.sh", "cursor", "claude-code", "codex", "optimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
skills-optimizer = "skill_optimizer.cli:main"
skill-optimizer = "skill_optimizer.cli:main"

[project.urls]
Homepage = "https://github.com/dapetun/skills-optimizer"
Specification = "https://agentskills.io/specification"

[tool.setuptools.packages.find]
where = ["."]
include = ["skill_optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["skill_optimizer"]
branch = true
